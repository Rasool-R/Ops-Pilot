name: OpsPilot CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Enforce least-privilege permissions for GitHub token
permissions:
  contents: read

jobs:
  lint-type-and-unit:
    name: Lint, Typecheck, Compose Config & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check app tests

      - name: Run Mypy static type checker
        run: mypy app tests

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Run unit tests
        env:
          APP_ENV: testing
          USE_MOCK_TELEMETRY: "true"
          REMEDIATION_DRY_RUN_ONLY: "true"
        run: pytest tests/unit -v

  postgres-readiness:
    name: Disposable PostgreSQL Connectivity Check
    runs-on: ubuntu-latest
    needs: lint-type-and-unit
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot_ci_user
          POSTGRES_PASSWORD: opspilot_ci_disposable_password
          POSTGRES_DB: opspilot_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opspilot_ci_user -d opspilot_ci_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify live readiness endpoint against disposable PostgreSQL
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://opspilot_ci_user:opspilot_ci_disposable_password@localhost:5432/opspilot_ci_test
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import create_app
          client = TestClient(create_app())
          resp = client.get('/api/v1/health/ready')
          assert resp.status_code == 200, f'Expected 200, got {resp.status_code}: {resp.text}'
          assert resp.json()['status'] == 'ready'
          print('PostgreSQL readiness verified successfully:', resp.json())
          "