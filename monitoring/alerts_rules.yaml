groups:
  - name: opspilot_ecommerce_mvp_alerts
    interval: 15s
    rules:
      - alert: OrderServiceHigh5xxRate
        expr: http_requests_5xx_rate{service="order-service"} > 0.05
        for: 30s
        labels:
          service_id: "order-service"
          severity: "CRITICAL"
        annotations:
          summary: "Elevated HTTP 5xx error rate detected on order-service"
          description: "5xx error ratio on order-service exceeded 5% threshold."

      - alert: OrderServiceHighLatencyP95
        expr: http_request_latency_p95{service="order-service"} > 1000
        for: 30s
        labels:
          service_id: "order-service"
          severity: "HIGH"
        annotations:
          summary: "High p95 latency on order-service"
          description: "95th percentile HTTP latency on order-service exceeded 1000ms."

      - alert: PostgresConnectionPoolSaturation
        expr: pg_stat_activity_active_connections{service="postgres"} >= 95 and pg_pool_wait_time_ms{service="order-service"} > 1000
        for: 30s
        labels:
          service_id: "postgres"
          severity: "CRITICAL"
        annotations:
          summary: "PostgreSQL active connections saturated with high pool wait time"
          description: "Active connections reached pool capacity and pool wait time exceeded 1000ms."