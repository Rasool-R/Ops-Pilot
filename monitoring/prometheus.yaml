global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "mvp-local"
    cluster: "opspilot-disposable"

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:

  - job_name: "opspilot-app"
    metrics_path: "/api/v1/health"
    static_configs:
      - targets: ["opspilot-app:8000"]

  - job_name: "ecomm-simulator"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["ecomm-simulator:8001"]